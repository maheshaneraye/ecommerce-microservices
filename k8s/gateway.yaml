apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config

data:
  nginx.conf: |
    events {}

    http {
        server {
            listen 80;

            location /users/ {
                rewrite ^/users/(.*) /$1 break;
                proxy_pass http://user-service:8000;
            }

            location /products/ {
                rewrite ^/products/(.*) /$1 break;
                proxy_pass http://product-service:8000;
            }

            location /orders/ {
                rewrite ^/orders/(.*) /$1 break;
                proxy_pass http://order-service:8000;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"

          limits:
            memory: "64Mi"
            cpu: "100m"

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway

spec:
  type: NodePort

  selector:
    app: api-gateway

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30008
