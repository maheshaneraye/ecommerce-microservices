apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
      - name: user-service
        image: maheshaneraye/user-service:latest

        ports:
        - containerPort: 8000

        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres:5432/ecommerce
        - name: SECRET_KEY
          valueFrom:
           secretKeyRef:
            name: ecommerce-secret
            key: SECRET_KEY

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"

          limits:
            memory: "128Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: user-service

spec:
  selector:
    app: user-service

  ports:
  - port: 8000
    targetPort: 8000
