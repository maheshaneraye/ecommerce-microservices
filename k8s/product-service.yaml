apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
      - name: product-service
        image: maheshaneraye/product-service:latest

        ports:
        - containerPort: 8000

        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres:5432/ecommerce

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"

          limits:
            memory: "128Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: product-service

spec:
  selector:
    app: product-service

  ports:
  - port: 8000
    targetPort: 8000
