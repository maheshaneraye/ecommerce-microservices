version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build: ./services/user-service
    ports:
      - "8001:8000"
    depends_on:
      - db

  product-service:
    build: ./services/product-service
    ports:
      - "8002:8000"
    depends_on:
      - db

  order-service:
    build: ./services/order-service
    ports:
      - "8003:8000"
    depends_on:
      - db
      - user-service
      - product-service
  gateway:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - product-service
      - order-service


volumes:
  postgres_data:
